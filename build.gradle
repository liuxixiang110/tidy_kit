plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group = 'com.tidy.kit'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        // 本机可用 JDK：IDEA 自带 JBR 21（PATH 里的 JDK 11 太老，不满足平台要求）
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 2024.1 平台要求字节码兼容 Java 17
// 源码编码必须写死 UTF-8:不指定的话 javac 跟随 daemon 默认字符集,
// 中文 Windows 上 daemon 换成老 JDK 启动就会把中文注释和中文界面文案读成乱码而编译失败
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

intellij {
    // 只是编译期用的平台(决定 API 版本与下载哪份 SDK);产物能装进哪些 IDE 由下面 patchPluginXml 的区间决定
    version = '2024.1.4'
    type = 'IC'
    plugins = ['com.intellij.java']
}

tasks {
    patchPluginXml {
        // 241(2024.1) ~ 262.*(2026.2):覆盖 IDEA / GoLand / DataGrip 等所有 IntelliJ 家族 IDE。
        // 升到 2027.x 再把 untilBuild 往上推一行;不写 '*' 是为了不兼容时报成清晰的“不适配”而不是运行期玄错。
        sinceBuild = '241'
        untilBuild = '262.*'
    }
    buildSearchableOptions {
        enabled = false
    }
}