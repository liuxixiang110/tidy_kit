plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.17.4'
}

group = 'com.tidy.kit'
version = '0.2.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        // 本机可用 JDK：IDEA 自带 JBR 21（PATH 里的 JDK 11 太老，不满足平台要求）
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 2024.1 平台要求字节码兼容 Java 17
// 源码编码必须写死 UTF-8:不指定的话 javac 跟随 daemon 默认字符集,
// 中文 Windows 上 daemon 换成老 JDK 启动就会把中文注释和中文界面文案读成乱码而编译失败
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

intellij {
    // 只是编译期用的平台(决定 API 版本与下载哪份 SDK),产物能装进哪些 IDE 由下面 patchPluginXml 的区间决定
    version = '2024.1.4'
    type = 'IC'
    // 不列 com.intellij.java:源码不碰 PSI,带上它只会误导――让人以为只有 IDEA 能用
    plugins = []
}

tasks {
    patchPluginXml {
        // sinceBuild 钉在 241(2024.1):代码用了 241 才有的 ContentFactory.getInstance()。
        // untilBuild 不封顶:JetBrains 家族各产品版本号不一(Rider/CLion/PyCharm/Aqua 都走 26x),
        // 写死上限会导致新主版本发布时插件集体装不上。代价:真不兼容时会是运行期报错而不是“不适配”提示。
        // 做法是根本不往 plugin.xml 里写 until-build(平台视同无上限);写 '*' 会被本插件解析成无效版本号。
        sinceBuild = '241'
        untilBuild.set(provider { null })
    }
    buildSearchableOptions {
        enabled = false
    }
}